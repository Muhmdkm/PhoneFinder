name: Build & Release PhoneFinder APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Source Code & Build APK
        run: |
          mkdir -p app/src/main/java/com/mansour/phonefinder/ui/theme
          mkdir -p app/src/main/java/com/mansour/phonefinder/ble
          mkdir -p app/src/main/java/com/mansour/phonefinder/service
          mkdir -p app/src/main/java/com/mansour/phonefinder/data
          mkdir -p app/src/main/java/com/mansour/phonefinder/receiver
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "PhoneFinder"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.10" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.mansour.phonefinder"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mansour.phonefinder"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.3" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")
              implementation("androidx.lifecycle:lifecycle-service:2.6.2")
              implementation("androidx.activity:activity-compose:1.8.0")
              val composeBom = platform("androidx.compose:compose-bom:2023.10.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3:1.1.1")
              implementation("androidx.compose.material:material-icons-extended:1.5.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_alert"
                  android:label="Phone Finder"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PhoneFinder">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".service.BLEConnectionService" android:enabled="true" android:exported="false" android:foregroundServiceType="connectedDevice" />
                  <receiver android:name=".receiver.BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Phone Finder</string></resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.PhoneFinder" parent="android:Theme.Material.Light.NoActionBar" /></resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/mansour/phonefinder/data/SettingsRepository.kt
          package com.mansour.phonefinder.data
          import android.content.Context
          class SettingsRepository(context: Context) {
              private val prefs = context.getSharedPreferences("phone_finder_prefs", Context.MODE_PRIVATE)
              fun getAlertDuration(): Int = prefs.getInt("alert_duration", 15)
              fun setAlertDuration(d: Int) = prefs.edit().putInt("alert_duration", d).apply()
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mansour/phonefinder/service/AlertManager.kt
          package com.mansour.phonefinder.service
          import android.content.Context
          import android.media.*
          import android.os.*
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlin.math.*

          class AlertManager(private val context: Context) {
              private val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val scope = CoroutineScope(Dispatchers.Default + Job())
              val isPlaying = MutableStateFlow(false)
              private var alertJob: Job? = null

              fun playAlert() {
                  if (isPlaying.value) return
                  isPlaying.value = true
                  alertJob = scope.launch {
                      val sampleRate = 44100
                      val numSamples = sampleRate / 2
                      val buffer = ShortArray(numSamples)
                      for (i in 0 until numSamples) {
                          val angle = 2.0 * PI * i / (sampleRate / 950.0)
                          buffer[i] = (sin(angle) * Short.MAX_VALUE).toInt().toShort()
                      }
                      val audioTrack = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(buffer.size * 2).setTransferMode(AudioTrack.MODE_STREAM).build()

                      val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_ALARM)
                      audioManager.setStreamVolume(AudioManager.STREAM_ALARM, maxVol, 0)
                      audioTrack.play()

                      val start = System.currentTimeMillis()
                      while (isActive && isPlaying.value && (System.currentTimeMillis() - start) < 15000L) {
                          audioTrack.write(buffer, 0, buffer.size)
                      }
                      audioTrack.stop()
                      audioTrack.release()
                      isPlaying.value = false
                  }
              }
              fun stopAlert() { isPlaying.value = false; alertJob?.cancel() }
              fun cleanup() { stopAlert(); scope.cancel() }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mansour/phonefinder/ble/BLEManager.kt
          package com.mansour.phonefinder.ble
          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.bluetooth.le.*
          import android.content.Context
          import android.os.*
          import kotlinx.coroutines.flow.*
          import java.util.*

          enum class ConnectionState { CONNECTED, CONNECTING, DISCONNECTED }
          data class BLEDevice(val name: String, val address: String, val rssi: Int)

          @SuppressLint("MissingPermission")
          class BLEManager(private val context: Context) {
              companion object {
                  const val TARGET_NAME = "PhoneFinder-ESP32"
                  val SERVICE_UUID: UUID = UUID.fromString("7a1e0001-1234-4567-8901-123456789abc")
                  val CHAR_UUID: UUID = UUID.fromString("7a1e0002-1234-4567-8901-123456789abc")
                  val CCCD_UUID: UUID = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb")
              }
              private val bluetoothManager = context.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
              private val adapter = bluetoothManager?.adapter
              val connectionState = MutableStateFlow(ConnectionState.DISCONNECTED)
              val discoveredDevices = MutableStateFlow<List<BLEDevice>>(emptyList())
              val commandFlow = MutableSharedFlow<String>(extraBufferCapacity = 64)
              private var gatt: BluetoothGatt? = null

              private val scanCallback = object : ScanCallback() {
                  override fun onScanResult(callbackType: Int, result: ScanResult) {
                      val dev = result.device
                      val name = dev.name ?: "Unknown"
                      val list = discoveredDevices.value.toMutableList()
                      if (list.none { it.address == dev.address }) {
                          list.add(BLEDevice(name, dev.address, result.rssi))
                          discoveredDevices.value = list
                      }
                  }
              }

              private val gattCallback = object : BluetoothGattCallback() {
                  override fun onConnectionStateChange(g: BluetoothGatt, status: Int, newState: Int) {
                      if (newState == BluetoothProfile.STATE_CONNECTED) {
                          connectionState.value = ConnectionState.CONNECTING
                          g.discoverServices()
                      } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                          connectionState.value = ConnectionState.DISCONNECTED
                      }
                  }
                  override fun onServicesDiscovered(g: BluetoothGatt, status: Int) {
                      val char = g.getService(SERVICE_UUID)?.getCharacteristic(CHAR_UUID)
                      if (char != null) {
                          g.setCharacteristicNotification(char, true)
                          val desc = char.getDescriptor(CCCD_UUID)
                          desc?.let { it.value = BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE; g.writeDescriptor(it) }
                      }
                  }
                  override fun onDescriptorWrite(g: BluetoothGatt, d: BluetoothGattDescriptor, s: Int) {
                      connectionState.value = ConnectionState.CONNECTED
                  }
                  override fun onCharacteristicChanged(g: BluetoothGatt, c: BluetoothGattCharacteristic, value: ByteArray) {
                      if (value.decodeToString().trim() == "FIND_PHONE") commandFlow.tryEmit("FIND_PHONE")
                  }
              }

              fun startScan() { adapter?.bluetoothLeScanner?.startScan(scanCallback) }
              fun connect(address: String) { adapter?.bluetoothLeScanner?.stopScan(scanCallback); gatt = adapter?.getRemoteDevice(address)?.connectGatt(context, false, gattCallback) }
              fun disconnect() { gatt?.disconnect(); gatt?.close(); connectionState.value = ConnectionState.DISCONNECTED }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mansour/phonefinder/service/BLEConnectionService.kt
          package com.mansour.phonefinder.service
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import com.mansour.phonefinder.MainActivity
          import com.mansour.phonefinder.ble.BLEManager
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.collectLatest

          class BLEConnectionService : Service() {
              companion object { var instance: BLEConnectionService? = null }
              lateinit var bleManager: BLEManager
              lateinit var alertManager: AlertManager
              private val scope = CoroutineScope(Dispatchers.Main + Job())

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  bleManager = BLEManager(this)
                  alertManager = AlertManager(this)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel("pf_channel", "Phone Finder", NotificationManager.IMPORTANCE_LOW)
                      (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(chan)
                  }
                  val notif = NotificationCompat.Builder(this, "pf_channel")
                      .setContentTitle("Phone Finder Active").setContentText("Listening for ESP32...")
                      .setSmallIcon(android.R.drawable.ic_dialog_alert).build()
                  startForeground(1, notif)

                  scope.launch {
                      bleManager.commandFlow.collectLatest { if (it == "FIND_PHONE") alertManager.playAlert() }
                  }
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mansour/phonefinder/receiver/BootReceiver.kt
          package com.mansour.phonefinder.receiver
          import android.content.*
          import android.os.Build
          import com.mansour.phonefinder.service.BLEConnectionService

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      val i = Intent(context, BLEConnectionService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mansour/phonefinder/MainActivity.kt
          package com.mansour.phonefinder
          import android.Manifest
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.mansour.phonefinder.ble.ConnectionState
          import com.mansour.phonefinder.service.BLEConnectionService

          class MainActivity : ComponentActivity() {
              private val permissionLauncher = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {}
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val perms = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) { perms.add(Manifest.permission.BLUETOOTH_SCAN); perms.add(Manifest.permission.BLUETOOTH_CONNECT) }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) { perms.add(Manifest.permission.POST_NOTIFICATIONS) }
                  permissionLauncher.launch(perms.toTypedArray())

                  val intent = Intent(this, BLEConnectionService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)

                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              val service = BLEConnectionService.instance
                              val bleManager = service?.bleManager
                              val alertManager = service?.alertManager
                              val state by (bleManager?.connectionState?.collectAsState() ?: remember { mutableStateOf(ConnectionState.DISCONNECTED) })
                              val devices by (bleManager?.discoveredDevices?.collectAsState() ?: remember { mutableStateOf(emptyList()) })
                              val isPlaying by (alertManager?.isPlaying?.collectAsState() ?: remember { mutableStateOf(false) })

                              Column(modifier = Modifier.padding(16.dp)) {
                                  Text("Phone Finder", fontSize = 24.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(8.dp))
                                  Card(colors = CardDefaults.cardColors(containerColor = if (state == ConnectionState.CONNECTED) Color(0xFF2E7D32) else Color(0xFFC62828))) {
                                      Text("Status: $state", color = Color.White, modifier = Modifier.padding(16.dp), fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.height(8.dp))
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Button(onClick = { bleManager?.startScan() }) { Text("Scan") }
                                      Button(onClick = { if (isPlaying) alertManager?.stopAlert() else alertManager?.playAlert() }) {
                                          Text(if (isPlaying) "Stop" else "Test Sound")
                                      }
                                  }
                                  Spacer(Modifier.height(16.dp))
                                  Text("Discovered Devices", fontWeight = FontWeight.Bold)
                                  LazyColumn {
                                      items(devices) { d ->
                                          Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp).clickable { bleManager?.connect(d.address) }) {
                                              Column(modifier = Modifier.padding(8.dp)) {
                                                  Text(d.name, fontWeight = FontWeight.Bold)
                                                  Text(d.address, fontSize = 12.sp)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Create Release and Upload APK Direct Link
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: PhoneFinder APK Release
          files: app/build/outputs/apk/debug/app-debug.apk
